name: OneSignal
kind: company
description: OneSignal is a lifecycle customer engagement platform for mobile push, web push, email, SMS/RCS, in-app
  messaging and iOS Live Activities, orchestrated through Journeys, segments and a single REST API at
  api.onesignal.com. It reports 1.3 trillion messages a year across 200k apps and 1.5 billion monthly active
  users. The developer surface is a published OpenAPI 3.1 contract, a full set of first-party server and client
  SDKs, a hosted OAuth-authenticated MCP server, an A2A agent card and six provider-published Agent Skills.
