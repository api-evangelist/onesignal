description: >-
  Binding between OneSignal's MCP tools and its REST operations. The honest
  finding is that the two MCP surfaces sit on opposite sides of the crosswalk:
  the tools we could actually introspect are documentation-search tools with no
  REST backing at all, while the product MCP server that presumably does wrap
  the REST API is OAuth-gated and would not return its tool list. Nothing here
  is mapped by guesswork — an unmappable tool is recorded as unmappable.
