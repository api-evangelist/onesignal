  endpoint: https://api.onesignal.com/mcp/oauth
  transport: http
  auth: oauth
  auth_detail: >-
    Browser-based OAuth 2.1 authorization_code + PKCE (S256) against
    https://api.onesignal.com, with RFC 7591 dynamic client registration at
    /oauth/register. See authentication/onesignal-authentication.yml.
  probe:
    method: POST tools/list
    http_status: 401
    body: 'Access denied. Please include an ''Authorization: ...'' header with a valid
      API key.'
