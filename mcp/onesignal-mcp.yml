provider: OneSignal
providerId: onesignal
name: OneSignal MCP
description: >-
  OneSignal ships two distinct remote MCP servers. The product server at
  api.onesignal.com/mcp/oauth is the one Cursor, Claude, Copilot and ChatGPT
  connect to; it is OAuth-gated, so its tool schemas require an authenticated
  introspection we did not perform. The documentation server at
  documentation.onesignal.com/mcp is anonymous and answered tools/list on the
  first probe — its three tools are captured verbatim in
  mcp/onesignal-mcp-tools.json.
status: published
