    authorization_server: https://api.onesignal.com/.well-known/oauth-authorization-server
  tools_captured: false
  tools_note: >-
    Live tool schemas are auth-gated. OneSignal's own Cursor plugin README names
    three read-only tools by hand — onesignal_health, onesignal_config,
    onesignal_reference_overview — but publishes no inputSchema for them. Names
    only; full schemas need an authenticated tools/list.
  evidence:
