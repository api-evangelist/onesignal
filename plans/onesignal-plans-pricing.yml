description: >-
  OneSignal publishes four tiers. Two are self-service with listed prices (Free
  and Growth); two are annual-contract and quote-only (Professional and
  Enterprise). Growth is the only tier with published per-channel unit
  economics. Note the plan tier is also a rate-limit tier — free apps are capped
  at 150 req/sec on message creation versus 6,000 on paid.
notes: >-
  Replaces the 2026-05-08 placeholder scaffold. Every price, quota and limit
  below was read off the published pricing page on 2026-08-13. Where a cell
  reads "Custom" on OneSignal's own comparison table it is recorded as custom,
  not guessed.
