provider: OneSignal
providerId: onesignal
description: >-
  Entity graph for the OneSignal REST API, derived from path nesting and
  id-reference fields. The spine is App > User > Subscription: an App is the
  tenant boundary and appears in almost every path; a User is a person addressed
  by an alias pair rather than by a OneSignal id; a Subscription is one reachable
  channel endpoint (a device, an email address, a phone number) owned by a User
  and transferable between Users.
derivation_note: >-
  The published spec declares only 7 named component schemas (ApiKeyToken,
  BasicErrorResponse, StructuredErrorItem, StructuredErrorResponse,
  TemplateResource, TemplateResourceContent, CreateUserConflictResponse), so
  most request and response bodies are inline. Relationships below are therefore
  derived from path nesting and id-reference parameters, not from $ref graphs.
tenancy:
  root: Organization
  boundary: App
  note: An Organization owns Apps. App API keys are scoped to one App; Organization
    API keys span every App.
entities:
- name: Organization
  id_field: organization_id
  operations:
  - list-audit-logs
  description: Top-level account grouping. Owns Apps, Organization API keys and audit
    logs.
- name: App
  id_field: app_id
  id_visibility: public
  operations:
  - view-apps
  - view-an-app
  - create-an-app
  - update-an-app
  description: The tenant boundary. Groups platforms (mobile apps, websites) under one
    ID. Required on nearly every request, in the path or as a query parameter.
  relationships:
  - type: belongs_to
    target: Organization
    via: organization_id
  - type: has_many
    target: User
  - type: has_many
    target: Subscription
  - type: has_many
    target: Segment
  - type: has_many
    target: Template
  - type: has_many
    target: ApiKeyToken
  - type: has_many
    target: Message
- name: User
  id_field: alias_label + alias_id
  id_note: >-
    Users are addressed by an alias PAIR in the path, not by a single opaque id
    — /apps/{app_id}/users/by/{alias_label}/{alias_id}. The canonical alias
    label is external_id, the caller's own identifier.
  operations:
  - create-user
  - view-user
  - update-user
  - delete-user
  relationships:
  - type: belongs_to
    target: App
    via: app_id
  - type: has_many
    target: Alias
  - type: has_many
    target: Subscription
  - type: has_many
    target: Tag
  - type: has_many
    target: CustomEvent
  - type: has_many
    target: InboxMessage
  properties:
  - tags (key/value personalization data, plan-capped)
  - identity (the alias map)
  - subscriptions
- name: Alias
  id_field: alias_label
  operations:
  - fetch-aliases
  - create-alias
  - delete-alias
  - fetch-identity-by-subscription
  - create-alias-by-subscription
  description: A named external identifier mapped onto a User. Multiple aliases can
    resolve to the same User, which is how identity is unified across devices and channels.
  relationships:
  - type: belongs_to
    target: User
- name: Subscription
  id_field: subscription_id
  operations:
  - create-subscription
  - update-subscription
  - delete-subscription
  - transfer-subscription
  - update-subscription-by-token
  description: One reachable channel endpoint — a push token on a device, an email address,
    or a phone number. The unit that message limits are counted against.
  relationships:
  - type: belongs_to
    target: User
    via: alias_label/alias_id, transferable via transfer-subscription
  - type: belongs_to
    target: App
    via: app_id
  addressable_by:
  - subscription_id
  - token_type + token (update-subscription-by-token)
  security_note: A subscription_id can be used to send notifications to that specific
    device, so it must never be shared across users. Identity Verification mitigates
    impersonation.
- name: Segment
  id_field: segment_id
  operations:
  - create-segments
  - view-segments
  - view-segment
  - update-segment
  - delete-segments
  description: A persisted, filter-defined audience within an App. Plan-capped (6 Free,
    10 Growth, 20 Professional).
  relationships:
  - type: belongs_to
    target: App
    via: app_id
  - type: has_many
    target: User
    via: filter evaluation, not a stored join
  alternative: inline filters[] on a message avoid creating a persisted Segment.
