openapi: 3.0.0
info:
  contact:
    email: devrel@onesignal.com
    name: OneSignal DevRel
    url: https://onesignal.com
  description: A powerful way to send personalized messages at scale and build effective customer engagement strategies. Learn more at onesignal.com
  termsOfService: https://onesignal.com/tos
  title: OneSignal Templates API
  version: 5.5.0
servers:
- url: https://api.onesignal.com
tags:
- name: Templates
paths:
  /templates:
    get:
      description: List templates for an app.
      operationId: view_templates
      parameters:
      - description: Your OneSignal App ID in UUID v4 format.
        explode: true
        in: query
        name: app_id
        required: true
        schema:
          type: string
        style: form
      - description: Maximum number of templates. Default and max is 50.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 50
          type: integer
        style: form
      - description: Pagination offset.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        style: form
      - description: Filter by delivery channel.
        explode: true
        in: query
        name: channel
        required: false
        schema:
          enum:
          - push
          - email
          - sms
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatesListResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: Bad Request
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
          description: Rate Limit Exceeded
      security:
      - rest_api_key: []
      summary: View templates
      tags:
      - Templates
    post:
      description: Create reusable message templates for push, email, and SMS channels.
      operationId: create_template
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResource'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: Bad Request
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: Unprocessable Entity
      security:
      - rest_api_key: []
      summary: Create template
      tags:
      - Templates
  /templates/{template_id}:
    delete:
      description: Delete a template by id.
      operationId: delete_template
      parameters:
      - explode: false
        in: path
        name: template_id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: app_id
        required: true
        schema:
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessBoolResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: Not Found
      security:
      - rest_api_key: []
      summary: Delete template
      tags:
      - Templates
    get:
      description: Fetch a single template by id.
      operationId: view_template
      parameters:
      - explode: false
        in: path
        name: template_id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: app_id
        required: true
        schema:
          type: string
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResource'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: Not Found
      security:
      - rest_api_key: []
      summary: View template
      tags:
      - Templates
    patch:
      description: Update an existing template.
      operationId: update_template
      parameters:
      - explode: false
        in: path
        name: template_id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: app_id
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResource'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: Bad Request
      security:
      - rest_api_key: []
      summary: Update template
      tags:
      - Templates
  /templates/{template_id}/copy_to_app:
    post:
      description: Copy a template to a destination app.
      operationId: copy_template_to_app
      parameters:
      - explode: false
        in: path
        name: template_id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: app_id
        required: true
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyTemplateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResource'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericError'
          description: Bad Request
      security:
      - organization_api_key: []
      summary: Copy template to another app
      tags:
      - Templates
