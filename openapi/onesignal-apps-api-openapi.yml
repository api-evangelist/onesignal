        source: "using System;\nusing System.Collections.Generic;\nusing System.Diagnostics;\nusing OneSignalApi.Api;\nusing OneSignalApi.Client;\nusing OneSignalApi.Model;\n\nnamespace Example\n{\n    public class CreateCustomEventsExample\n    {\n        public static void Main()\n        {\n            Configuration config = new Configuration();\n            config.BasePath = \"https://api.onesignal.com\";\n            // Configure Bearer token for authorization: rest_api_key\n            config.AccessToken = \"YOUR_REST_API_KEY\";\n\n            var apiInstance = new DefaultApi(config);\n            var appId = \"YOUR_APP_ID\";  // string | Your OneSignal App ID in UUID v4 format.\n            var customEventsRequest = new CustomEventsRequest(); // CustomEventsRequest | \n\n            try\n            {\n                // Create custom events\n                Object result = apiInstance.CreateCustomEvents(appId, customEventsRequest);\n                Debug.WriteLine(result);\n            }\n            catch (ApiException  e)\n            {\n                Debug.Print(\"Exception when calling DefaultApi.CreateCustomEvents: \" + e.Message );\n                Debug.Print(\"Status Code: \"+ e.ErrorCode);\n                // e.ErrorMessages flattens any error-envelope shape to an IReadOnlyList<string>;\n                // the raw body remains on e.ErrorContent.\n                Debug.Print(\"Error Messages: \" + string.Join(\", \", e.ErrorMessages));\n                Debug.Print(\"Response Body: \" + e.ErrorContent);\n                Debug.Print(e.StackTrace);\n            }\n        }\n    }\n}"
      - lang: rust
        label: Rust SDK
        source: "use onesignal_rust_api::apis::configuration::Configuration;\nuse onesignal_rust_api::apis::default_api;\n\nuse onesignal_rust_api::models;\n\n\n#[tokio::main]\nasync fn main() {\n    let mut configuration = Configuration::new();\n    configuration.rest_api_key_token = Some(\"YOUR_REST_API_KEY\".to_string());\n\n\n    // Realistic values are pulled from the spec's `example:` fields where present.\n    let app_id: &str = \"YOUR_APP_ID\";\n    let custom_events_request: models::CustomEventsRequest = todo!();\n\n    match default_api::create_custom_events(&configuration, app_id, custom_events_request).await {\n        Ok(resp) => println!(\"{:?}\", resp),\n        Err(e @ onesignal_rust_api::apis::Error::ResponseError(_)) => {\n            // `e.error_messages()` flattens any error-envelope shape to a Vec<String>;\n            // the raw response remains on the ResponseError variant.\n            eprintln!(\"create_custom_events failed: {:?}\", e.error_messages());\n        }\n        Err(e) => eprintln!(\"create_custom_events failed: {:?}\", e),\n    }\n}"
      parameters:
      - name: app_id
        in: path
        description: Your OneSignal App ID in UUID v4 format. See [Keys & IDs](/docs/en/keys-and-ids).
        schema:
          type: string
        required: true
      - name: Authorization
        in: header
        description: Your app API key with prefix `Key `. See [Keys & IDs](/docs/en/keys-and-ids).
        schema:
          type: string
          default: Key YOUR_APP_API_KEY
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - events
              properties:
                events:
                  type: array
                  description: Array of event objects to be recorded. Maximum size for each event is `2024` bytes. Maximum size of request is `1` MB.
                  items:
                    properties:
                      name:
                        type: string
                        description: The identifier or name of the event. Maximum 128 characters.
                      external_id:
                        type: string
                        description: The external ID of the user targeted for the event. Either the user's External ID or OneSignal ID is required.
                      onesignal_id:
                        type: string
                        description: The OneSignal ID of the user targeted for the event. Either the user's External ID or OneSignal ID is required.
                      timestamp:
                        type: string
                        description: Time the event occurred as an [ISO8601 formatted string](https://www.timestamp-converter.com/). Defaults to the current time if not provided. If the timestamp provided is in the future, it will be reset to the current time.
                      idempotency_key:
                        type: string
                        description: A unique UUID for avoiding duplicate custom event processing. Repeated events with the same idempotency_key will not be processed.
                      properties:
                        type: object
                        description: 'Properties or data related to the event, like {"geography": "USA"}'
                    required:
                    - name
                    type: object
      responses:
        '202':
          description: Accepted with optional partial-success details. The response body lists any individual events that could not be processed (typically because the supplied `event_user_id` does not resolve to a OneSignal user); other events in the same payload were processed normally. An empty `errors` array (or absent body) means every event was accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    description: Errors for specific events in the payload. If this is returned, only the specified events have failed -- other events in the same payload were successfully processed.
                    items:
                      type: object
                      properties:
                        event_user_id:
                          type: string
                          description: The External ID in the event that failed.
                          example: abc123
                        event_id:
                          type: string
                          description: The value of the `event_id` property in the event, if it has one.
                          example: 567491ee-9105-4a87-9cbc-ed78a571645b
                        error:
                          type: object
                          description: Information about the error that caused the event to not be processed.
                          properties:
                            code:
                              type: string
                              description: A short error code describing the error.
                              example: not found
                            title:
                              type: string
                              description: Human-readable information about what caused the error.
                              example: failed to find a onesignal_id for user_id abc123
        '400':
          description: Bad request. The payload was rejected (e.g., malformed JSON or missing required fields). The response body shape is currently an empty object placeholder. Treat any 400 as a fatal request error.
          content:
            application/json:
              examples:
                Result:
                  value: {}
              schema:
                type: object
                properties: {}
        '401':
          description: Unauthorized. The `Authorization` header is missing or invalid. This response uses `text/plain` with an empty body (not the standard `BasicErrorResponse` envelope). Treat any 401 from this endpoint as an auth failure regardless of body.
          content:
            text/plain:
              examples:
                Result:
                  value: ''
        '429':
          description: Rate limit exceeded. Wait the number of seconds in the `Retry-After` header before retrying.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying the request. Always emitted on 429 responses.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorResponse'
              example:
                errors:
                - API rate limit exceeded
        '503':
          description: Service temporarily unavailable. Retry after a short backoff. The body may be empty or non-JSON in some failure modes.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying. Optional — may be absent when the response is generated upstream.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorResponse'
              example:
                errors:
                - Service temporarily unavailable
      deprecated: false
      tags:
      - Apps
      security:
      - {}
