      - lang: python
        label: Python SDK
        source: "import onesignal\nfrom onesignal.api import default_api\nfrom onesignal.models import *\nfrom pprint import pprint\n\n# See configuration.py for a list of all supported configuration parameters.\n# Some of the OneSignal endpoints require ORGANIZATION_API_KEY token for authorization, while others require REST_API_KEY.\n# We recommend adding both of them in the configuration page so that you will not need to figure it out yourself.\nconfiguration = onesignal.Configuration(\n    rest_api_key = \"YOUR_REST_API_KEY\", # App REST API key required for most endpoints\n    organization_api_key = \"YOUR_ORGANIZATION_API_KEY\" # Organization key is only required for creating new apps and other top-level endpoints\n)\n\n\n# Enter a context with an instance of the API client\nwith onesignal.ApiClient(configuration) as api_client:\n    # Create an instance of the API class\n    api_instance = default_api.DefaultApi(api_client)\n    app_id = \"YOUR_APP_ID\" # Your OneSignal App ID in UUID v4 format. \n    activity_type = \"order_status\" # The name of the Live Activity defined in your app. This should match the attributes struct used in your app's Live Activity implementation. \n    start_live_activity_request = StartLiveActivityRequest(\n        name=\"name_example\",\n        event=\"start\",\n        activity_id=\"activity_id_example\",\n        event_attributes={},\n        event_updates={},\n        contents=LanguageStringMap(\n            en=\"en_example\",\n            ar=\"ar_example\",\n            bs=\"bs_example\",\n            bg=\"bg_example\",\n            ca=\"ca_example\",\n            zh_hans=\"zh_hans_example\",\n            zh_hant=\"zh_hant_example\",\n            zh=\"zh_example\",\n            hr=\"hr_example\",\n            cs=\"cs_example\",\n            da=\"da_example\",\n            nl=\"nl_example\",\n            et=\"et_example\",\n            fi=\"fi_example\",\n            fr=\"fr_example\",\n            ka=\"ka_example\",\n            de=\"de_example\",\n            el=\"el_example\",\n            hi=\"hi_example\",\n            he=\"he_example\",\n            hu=\"hu_example\",\n            id=\"id_example\",\n            it=\"it_example\",\n            ja=\"ja_example\",\n            ko=\"ko_example\",\n            lv=\"lv_example\",\n            lt=\"lt_example\",\n            ms=\"ms_example\",\n            nb=\"nb_example\",\n            pl=\"pl_example\",\n            fa=\"fa_example\",\n            pt=\"pt_example\",\n            pa=\"pa_example\",\n            ro=\"ro_example\",\n            ru=\"ru_example\",\n            sr=\"sr_example\",\n            sk=\"sk_example\",\n            es=\"es_example\",\n            sv=\"sv_example\",\n            th=\"th_example\",\n            tr=\"tr_example\",\n            uk=\"uk_example\",\n            vi=\"vi_example\",\n        ),\n        headings=LanguageStringMap(\n            en=\"en_example\",\n            ar=\"ar_example\",\n            bs=\"bs_example\",\n            bg=\"bg_example\",\n            ca=\"ca_example\",\n            zh_hans=\"zh_hans_example\",\n            zh_hant=\"zh_hant_example\",\n            zh=\"zh_example\",\n            hr=\"hr_example\",\n            cs=\"cs_example\",\n            da=\"da_example\",\n            nl=\"nl_example\",\n            et=\"et_example\",\n            fi=\"fi_example\",\n            fr=\"fr_example\",\n            ka=\"ka_example\",\n            de=\"de_example\",\n            el=\"el_example\",\n            hi=\"hi_example\",\n            he=\"he_example\",\n            hu=\"hu_example\",\n            id=\"id_example\",\n            it=\"it_example\",\n            ja=\"ja_example\",\n            ko=\"ko_example\",\n            lv=\"lv_example\",\n            lt=\"lt_example\",\n            ms=\"ms_example\",\n            nb=\"nb_example\",\n            pl=\"pl_example\",\n            fa=\"fa_example\",\n            pt=\"pt_example\",\n            pa=\"pa_example\",\n            ro=\"ro_example\",\n            ru=\"ru_example\",\n            sr=\"sr_example\",\n            sk=\"sk_example\",\n            es=\"es_example\",\n            sv=\"sv_example\",\n            th=\"th_example\",\n            tr=\"tr_example\",\n            uk=\"uk_example\",\n            vi=\"vi_example\",\n        ),\n        stale_date=1,\n        priority=1,\n        ios_relevance_score=3.14,\n        idempotency_key=\"idempotency_key_example\",\n        include_aliases=IncludeAliases(\n            key=[\n                \"key_example\",\n            ],\n        ),\n        include_subscription_ids=[\n            \"include_subscription_ids_example\",\n        ],\n        included_segments=[\n            \"included_segments_example\",\n        ],\n        excluded_segments=[\n            \"excluded_segments_example\",\n        ],\n        filters=[\n            Filter(\n                field=\"tag\",\n                key=\"level\",\n                value=\"10\",\n                hours_ago=\"24\",\n                radius=3.14,\n                lat=3.14,\n                long=3.14,\n                relation=\">\",\n            ),\n        ],\n    ) \n\n    try:\n        # Start Live Activity\n        api_response = api_instance.start_live_activity(app_id, activity_type, start_live_activity_request)\n        pprint(api_response)\n    except onesignal.ApiException as e:\n        print(\"Exception when calling DefaultApi->start_live_activity: %s\\n\" % e)\n        print(\"Status Code: %s\" % e.status)\n        print(\"Response Body: %s\" % e.body)"
      - lang: php
