app_lifecycle:
  disablement: >-
    Apps are disabled automatically when the rolling 15-minute application
    message limit is exceeded, and can be re-enabled from a dashboard banner.
    This is an operational lifecycle event a caller must handle, not a billing
    one.
  source: https://documentation.onesignal.com/reference/rate-limits
