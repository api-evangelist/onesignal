provider: OneSignal
providerId: onesignal
description: >-
  How the OneSignal REST API changes over time. The short version: it does not
  version, it does not sunset, and it does not signal deprecation in HTTP. What
  it does have is a well-maintained dated changelog and a public status page.
  The one real deprecation on record — the November 2024 legacy API key
  migration — was announced in docs and left the old keys working indefinitely.
versioning:
  strategy: unversioned
  url_versioning: false
  header_versioning: false
  detail: >-
    api.onesignal.com has no version path segment and no version request header.
    The published OpenAPI carries info.version 11.6, which is a document
    revision, not a version a caller can pin or negotiate.
  spec_version: '11.6'
  spec_url: https://documentation.onesignal.com/openapi.json
  legacy_spec_version: 5.5.0
  legacy_spec_note: openapi/_original/onesignal-openapi.yml, the previously harvested
    3.0.0 document, declares info.version 5.5.0 and 44 operations — 15 fewer than the
    current spec.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  detail: >-
    No published deprecation policy, and no RFC 8594 Sunset or Deprecation
    response headers are documented. Zero operations in the published OpenAPI
    carry deprecated: true.
  deprecated_operations: []
  historical_deprecations:
  - name: Legacy User Auth key and original REST API key
    announced: '2024-11'
    status: still accepted
    detail: >-
      App and Organization API keys replaced them in November 2024. The
      management UI was removed and new legacy keys cannot be created, but
      existing legacy keys continue to work with no announced end date.
    source: https://documentation.onesignal.com/docs/en/keys-and-ids
  - name: Players API
    status: superseded
    detail: >-
      The /players surface has been superseded by the Users and Subscriptions
      model (/apps/{app_id}/users, /apps/{app_id}/subscriptions). The current
      published spec retains only POST /players/csv_export; the other player
      operations present in the 5.5.0 document are gone from 11.6. This
      removal was never marked with deprecated: true in either spec.
  - name: external_id as the idempotency field
    status: still accepted
    detail: Renamed to idempotency_key to remove the collision with the Users external_id
      alias. Both names remain supported.
    source: https://documentation.onesignal.com/reference/idempotent-notification-requests
