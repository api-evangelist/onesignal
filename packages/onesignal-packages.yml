description: >-
  First-party OneSignal client libraries. Two families: the OpenAPI-generated
  server-side REST API clients (onesignal-*-api, released in lockstep on the
  5.11/5.12/5.13 line) and the client-side mobile/web SDKs that collect
  subscriptions on device. Every version/published pair below was read from the
  registry metadata endpoint on 2026-08-13.
